name: Sync

# Receives the game's current stable and beta versions from BUTR/Bannerlord.ReferenceAssemblies, which
# sends them only once the reference assemblies of both are on NuGet, and turns them into the
# GAME_VERSION_STABLE and GAME_VERSION_BETA variables the mod repositories build against. When they
# changed, waits for NuGet to index the packages and tells the repositories.
#
# The versions come from that repository's build registry, which polls the Steam branches every three
# hours, so this workflow no longer logs into Steam or watches the Steam News feed itself.

on:
  repository_dispatch:
    types: [game_versions]
  workflow_dispatch:
    inputs:
      stable:
        description: "Stable game version, e.g. v1.4.8"
        required: true
      beta:
        description: "Beta game version; the stable one when Steam has no beta branch"
        required: true

concurrency:
  group: sync-workflow
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STABLE: ${{ github.event.client_payload.stable || github.event.inputs.stable }}
      BETA: ${{ github.event.client_payload.beta || github.event.inputs.beta }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare with the current variables
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_EXTENDED }}
        run: |
          pattern='^[ev][0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "$STABLE" =~ $pattern && "$BETA" =~ $pattern ]]; then
            echo "::error::Refusing to set malformed versions: stable='$STABLE' beta='$BETA'"
            exit 1
          fi
          current_stable=$(gh variable get GAME_VERSION_STABLE --org BUTR 2>/dev/null || true)
          current_beta=$(gh variable get GAME_VERSION_BETA --org BUTR 2>/dev/null || true)
          echo "Received stable=$STABLE beta=$BETA; variables say stable=$current_stable beta=$current_beta"
          if [ "$STABLE" = "$current_stable" ] && [ "$BETA" = "$current_beta" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the variables
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_EXTENDED }}
        run: |
          gh variable set GAME_VERSION_STABLE --org BUTR --body "$STABLE" --visibility all
          gh variable set GAME_VERSION_BETA --org BUTR --body "$BETA" --visibility all
          # Outside the org, so the org variables do not reach it.
          gh variable set GAME_VERSION_STABLE --repo Aragas/Bannerlord.MBOptionScreen --body "$STABLE"
          gh variable set GAME_VERSION_BETA --repo Aragas/Bannerlord.MBOptionScreen --body "$BETA"

      - name: Wait for NuGet to index the packages
        if: steps.compare.outputs.changed == 'true'
        run: sleep 600

      - name: Dispatch Game Update
        if: steps.compare.outputs.changed == 'true'
        uses: ./.github/actions/dispatch-game-update
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
